{% extends "base.html" %}
{% block title %}Media Logger | Copy Status{% endblock %}

{% block content %}
<h2 class="mb-4">Copy Status</h2>

{% for folder in folders %}
<div class="card mb-4 p-3 shadow-lg">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center">
      <img src="{{ url_for('static', filename='img/cameras/' + folder.camera.image) }}"
           alt="{{ folder.camera.name }}"
           class="me-3 rounded shadow-sm"
           style="height: 48px; width: 48px; object-fit: cover;">
      <div>
        <div class="fs-5 fw-semibold">{{ folder.folder }}</div>
        <div class="text-muted small">{{ folder.camera.name }}</div>
      </div>
    </div>
<button class="btn btn-outline-primary btn-sm open-btn"
        id="open-btn-{{ loop.index }}" disabled>
  <i class="bi bi-folder-symlink"></i> Open
</button>
  </div>

    <!-- Status Steps -->
    <div class="d-flex justify-content-around text-center mb-2 status-steps" id="status-steps-{{ loop.index }}">
  <div class="step waiting active" id="step-waiting-{{ loop.index }}">
    <div class="circle bg-secondary text-white">
      <i class="bi bi-clock"></i>
    </div>
    <div class="label">Waiting</div>
  </div>
  <div class="step copying" id="step-copying-{{ loop.index }}">
    <div class="circle bg-warning text-white">
      <i class="bi bi-arrow-repeat"></i>
    </div>
    <div class="label">Copying</div>
  </div>
  <div class="step done" id="step-done-{{ loop.index }}">
    <div class="circle bg-success text-white">
      <i class="bi bi-check-lg"></i>
    </div>
    <div class="label">Done</div>
  </div>
</div>
    <!-- Progress Bar -->
<div class="progress mb-2 d-none" style="height: 6px;" id="progress-wrap-{{ loop.index }}">
  <div class="progress-bar" id="progress-bar-{{ loop.index }}" role="progressbar"
       style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
</div>

    <!-- Progress Info -->
<div class="text-center text-muted small">
  <strong><span id="files-{{ loop.index }}">0</span></strong> images copied –
  Total size: <strong><span id="size-{{ loop.index }}">0 MB</span></strong>
</div>

<!-- Erro explícito + retry -->
<div class="alert alert-danger d-flex justify-content-between align-items-center mt-2 mb-0 py-2 px-3 small d-none" id="error-{{ loop.index }}">
  <span id="error-msg-{{ loop.index }}"></span>
  <button type="button" class="btn btn-sm btn-outline-danger ms-2 flex-shrink-0" id="retry-btn-{{ loop.index }}">
    <i class="bi bi-arrow-clockwise"></i> Retry
  </button>
</div>
</div>
{% endfor %}

<div class="d-flex justify-content-between mt-4">
    <a id="back-link" href="{{ url_for('select', disk=disk, destination=destination) }}" class="btn btn-secondary">← Back</a>
    <button id="start-copy" class="btn btn-primary" disabled>Copying...</button>
</div>


<!-- Bootstrap Icons (if not already loaded in base.html) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<script>
const folders = {{ folders | tojson | safe }};
const disk = {{ disk | tojson | safe }};
const destination = {{ destination | tojson | safe }};

function setDoneState(i, ok) {
  const stepDone = document.getElementById(`step-done-${i + 1}`);
  const circle = stepDone.querySelector('.circle');
  const icon = circle.querySelector('i');
  const label = stepDone.querySelector('.label');

  stepDone.classList.add('active');
  if (ok) {
    circle.classList.remove('bg-danger');
    circle.classList.add('bg-success');
    icon.className = 'bi bi-check-lg';
    label.textContent = 'Done';
  } else {
    circle.classList.remove('bg-success');
    circle.classList.add('bg-danger');
    icon.className = 'bi bi-x-lg';
    label.textContent = 'Error';
  }
}

async function runCopy(i) {
  const folder = folders[i];
  const stepWaiting = document.getElementById(`step-waiting-${i + 1}`);
  const stepCopying = document.getElementById(`step-copying-${i + 1}`);
  const stepDone = document.getElementById(`step-done-${i + 1}`);
  const filesSpan = document.getElementById(`files-${i + 1}`);
  const sizeSpan = document.getElementById(`size-${i + 1}`);
  const openBtn = document.getElementById(`open-btn-${i + 1}`);
  const errorBox = document.getElementById(`error-${i + 1}`);
  const errorMsg = document.getElementById(`error-msg-${i + 1}`);
  const progressWrap = document.getElementById(`progress-wrap-${i + 1}`);
  const progressBar = document.getElementById(`progress-bar-${i + 1}`);

  errorBox.classList.add('d-none');
  stepWaiting.classList.remove("active");
  stepDone.classList.remove("active");
  stepCopying.classList.add("active");
  progressWrap.classList.remove('d-none');
  progressBar.style.width = '0%';
  progressBar.setAttribute('aria-valuenow', '0');

  try {
    const res = await fetch("/copy", {
      method: "POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folders: [folder], disk: disk, destination: destination })
    });

    if (!res.ok || !res.body) {
      throw new Error(`Copy failed (HTTP ${res.status}).`);
    }

    // O backend manda um JSON por linha (progresso a progresso, e por último o resultado final)
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalData = null;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // guarda a linha incompleta pro próximo pedaço

      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);

        if (event.type === 'progress') {
          const pct = event.total > 0 ? Math.round((event.copied / event.total) * 100) : 100;
          progressBar.style.width = `${pct}%`;
          progressBar.setAttribute('aria-valuenow', String(pct));
          filesSpan.innerText = `${event.copied}/${event.total}`;
          sizeSpan.innerText = event.size;
        } else if (event.type === 'error') {
          throw new Error(event.error || 'Copy failed.');
        } else if (event.type === 'done') {
          finalData = event;
        }
      }
    }

    if (!finalData) {
      throw new Error('Server closed the connection unexpectedly.');
    }

    stepCopying.classList.remove("active");
    progressBar.style.width = '100%';
    progressWrap.classList.add('d-none');
    setDoneState(i, !(finalData.failed && finalData.failed.length > 0));

    filesSpan.innerText = finalData.copied || 0;
    sizeSpan.innerText = finalData.size || "0 MB";

    if (finalData.path) {
      openBtn.disabled = false;
      openBtn.onclick = () => fetch(`/open_folder?path=${encodeURIComponent(finalData.path)}`);
    }

    if (finalData.failed && finalData.failed.length > 0) {
      const list = finalData.failed.map(f => `${f.file}: ${f.reason}`).join(' · ');
      errorMsg.textContent = `${finalData.failed.length} file(s) failed to copy — ${list}`;
      errorBox.classList.remove('d-none');
    }

  } catch (err) {
    stepCopying.classList.remove("active");
    progressWrap.classList.add('d-none');
    setDoneState(i, false);
    errorMsg.textContent = err.message || 'Copy failed — check your connection and try again.';
    errorBox.classList.remove('d-none');
  }
}

let copyStarted = false;
let copyFinished = false;

async function startAllCopies() {
  if (copyStarted) return;
  copyStarted = true;

  const button = document.getElementById('start-copy');
  const backLink = document.getElementById('back-link');
  button.disabled = true;
  button.innerText = 'Copying...';
  backLink.classList.add('disabled');

  for (let i = 0; i < folders.length; i++) {
    await runCopy(i);
  }

  copyFinished = true;
  button.innerText = 'Done — Back to Home';
  button.disabled = false;
  backLink.classList.remove('disabled');
}

document.getElementById('start-copy').addEventListener('click', () => {
  if (copyFinished) {
    window.location.href = '/';
    return;
  }
  startAllCopies();
});

folders.forEach((_, i) => {
  document.getElementById(`retry-btn-${i + 1}`).addEventListener('click', () => runCopy(i));
});

// Começa a copiar automaticamente assim que a tela abre — não precisa clicar em nada
startAllCopies();
</script>

{% endblock %}
